---
plugin: community.proxmox.proxmox
url: https://192.168.0.63:8006
user: root@pam
token_id: "{{ lookup('community.sops.sops', 'vault/pve.sops.yaml', extract='[\"pve_ansible_token_id\"]')}}"
token_secret: "{{ lookup('community.sops.sops', 'vault/pve.sops.yaml', extract='[\"pve_ansible_token_secret\"]')}}"
validate_certs: false
want_facts: true
keyed_groups:
  - key: proxmox_tags_parsed
    separator: ""
    prefix: ""

groups:
  # rhce_proxy: "proxmox_name == 'rhce-1'"
  # rhce_webservers: "proxmox_name in ['rhce-2', 'rhce-3']"
  # rhce_database: "proxmox_name == 'rhce-4'"
  # media: "'media' in (proxmox_tags_parsed|list)"
  # rhce: "'rhce' in (proxmox_tags_parsed|list)"

compose:
  ansible_host: >-
    proxmox_agent_interfaces[1]['ip-addresses'][0].split('/')[0]
    if proxmox_vmtype == 'qemu'
    else proxmox_lxc_interfaces[1]['inet'].split('/')[0]

want_proxmox_nodes_ansible_host: true
