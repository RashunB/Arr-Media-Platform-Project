---
- name: Observability Stack Control
  hosts: observability_pve
  become: true
  force_handlers: true
  roles:
    - role: docker_base
    - role: observability_node
      vars:
        observability_node_loki_remote_url: "{{ hostvars['control']['loki_remote_url'] }}"
        observability_node_pve_exporter_enabled: true