---
- name: Media Platform
  hosts: media_platform
  become: true
  tasks:
  - name: Install and configure Docker
    ansible.builtin.import_role: 
      name: docker_base
    tags: docker

  - name: NFS mounts
    ansible.builtin.import_role: 
      name: nfs_client
    tags: nfs_mount
  
  - name: Deploy Media Platform
    ansible.builtin.import_role: 
      name: media_platform
    tags: media_platform
