---
networks:
  observability:
    name: observability

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    pull_policy: always
    restart: unless-stopped
    user: "1000:1000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - 9090:9090/tcp
    security_opt:
      - no-new-privileges:true
    volumes:
      - /opt/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - /opt/prometheus/config/rules:/etc/prometheus/rules
      - /opt/prometheus/data/:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
      - --web.enable-admin-api
    networks:
      - observability

  node-exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: node-exporter
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.cpu.info
    security_opt:
      - no-new-privileges:true
    volumes:
      - /:/host:ro,rslave

  smartctl-exporter:
    image: quay.io/prometheuscommunity/smartctl-exporter:latest
    container_name: smartctl-exporter
    pull_policy: always
    restart: unless-stopped
    user: root
    privileged: true
    networks:
      - observability

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    pull_policy: always
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - observability

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    pull_policy: always
    restart: unless-stopped
    env_file:
      - /opt/dozzle/dozzle.env
    ports:
      - 8080:8080/tcp
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/dozzle/data:/data
    networks:
      - observability

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    user: "1000:1000"
    pull_policy: always
    restart: unless-stopped
    ports:
      - 3000:3000/tcp
    security_opt:
      - no-new-privileges:true
    volumes:
      - /opt/grafana/data:/var/lib/grafana
      - /opt/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - /opt/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - observability


  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    pull_policy: always
    restart: unless-stopped
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    ports:
      - 12345:12345
      - 514:514/tcp
    volumes:
      - /opt/alloy/alloy-config.yaml:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - observability

  loki:
    image: grafana/loki:latest
    container_name: loki
    user: "1000:1000"
    pull_policy: always
    restart: unless-stopped
    command: "-config.file=/etc/loki/config.yaml"
    ports:
      - 3100:3100/tcp
    volumes:
      - /opt/loki/loki-config.yaml:/etc/loki/config.yaml
      - /opt/loki/data:/loki
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - observability
