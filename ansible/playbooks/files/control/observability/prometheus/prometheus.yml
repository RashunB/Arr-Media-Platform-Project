global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: homelab

scrape_configs:
  - job_name: Prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: Control Node-Exporter
    static_configs:
      - targets: ["host.docker.internal:9100"]
    relabel_configs:
      - target_label: instance
        replacement: "node-exporter:9100"

  - job_name: Control cAdvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    relabel_configs:
      - target_label: instance
        replacement: "cadvisor:8080"

  - job_name: Control Smartctl-Exporter
    static_configs:
      - targets: ["smartctl-exporter:9633"]
    relabel_configs:
      - target_label: instance
        replacement: "smartctl-exporter:9633"

  - job_name: PVE PVE-Exporter
    static_configs:
      - targets: ["192.168.0.248:9221"]
    relabel_configs:
      - target_label: instance
        replacement: "pve-exporter:9221"

  - job_name: PVE Node-Exporter
    static_configs:
      - targets: ["192.168.0.248:9100"]
    relabel_configs:
      - target_label: instance
        replacement: "node_exporter:9100"

  - job_name: PVE cAdvisor
    static_configs:
      - targets: ["192.168.0.248:8080"]
    relabel_configs:
      - target_label: instance
        replacement: "cadvisor:8080"

  - job_name: PVE Smartctl-Exporter
    static_configs:
      - targets: ["192.168.0.248:9633"]
    relabel_configs:
      - target_label: instance
        replacement: "smartctl-exporter:9633"
