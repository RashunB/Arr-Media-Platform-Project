---
- name: Create Loki directories
  ansible.builtin.file:
    path: "{{ observability_control_root_dir }}/loki"
    owner: ansible
    group: ansible
    mode: "0755"
    state: directory

- name: Copy Loki files
  ansible.builtin.template:
    src: loki/loki-config.yml.j2
    dest: "{{ observability_control_root_dir }}/loki/loki-config.yml"
    owner: ansible
    group: ansible
    mode: "0644"
  notify: Restart Loki
