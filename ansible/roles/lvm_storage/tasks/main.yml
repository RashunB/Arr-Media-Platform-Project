- name: Create Media VG
  community.general.lvg:
    vg: "{{ vg }}"
    pvs:
      - /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi0
      - /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1
    state: "{{ state_enabled }}"

- name: Create Media LV
  community.general.lvol:
    vg: "{{ vg }}"
    lv: "{{ lv }}"
    pvs:
      - /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi0
      - /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1
    size: 100%VG
    state: "{{ state_enabled }}"

- name: Format Filesystem
  community.general.filesystem:
    dev: "{{ mount_device }}"
    fstype: ext4
    state: "{{ state_enabled }}"

- name: Create Direcory
  ansible.builtin.file:
    path: "{{ mountpoint }}"
    owner: "{{ media_share_id }}"
    group: "{{ media_share_id }}"
    mode: "02775"
    state: directory

- name: Mount
  ansible.posix.mount:
    path: "{{ mountpoint }}/"
    src: "{{ mount_device }}"
    fstype: ext4
    state: mounted
