---
- name: Create required directories
  ansible.builtin.file:
    path: "{{ observability_node_root_dir }}/pve-exporter"
    owner: ansible
    group: ansible
    mode: "0755"
    state: directory

- name: Copy Alloy files
  ansible.builtin.template:
    src: vault/pve.yml pve-exporter/prometheus.yml.j2
    dest: "{{ observability_node_root_dir }}/pve-exporter/pve.yml"
    owner: ansible
    group: ansible
    mode: "0644"
  notify: Restart Alloy
