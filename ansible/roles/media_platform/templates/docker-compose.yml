networks:
  media:
    name: media

services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - JELLYFIN_PublishedServerUrl=http://192.168.0.5 #optional
    volumes:
      - "{{ media_platform_root_dir }}/jellyfin/library:/config"
      - "{{ media_platform_tvseries_dir }}:/data/tvshows"
      - "{{ media_platform_movies_dir }}:/data/movies"
    ports:
      - 8096:8096
      - 8920:8920 #optional
      - 7359:7359/udp #optional
      - 1900:1900/udp #optional
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - "{{ media_platform_root_dir }}/prowlarr/data:/config"
    ports:
      - 9696:9696
    restart: unless-stopped

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - "{{ media_platform_root_dir }}/sabnzbd/config:/config"
      - "{{ media_platform_root_dir }}/incomplete-downloads:/incomplete-downloads" #optional
      - "{{ media_platform_root_dir }}/downloads:/downloads" #optional
    ports:
      - 8080:8080
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - "{{ media_platform_root_dir }}/radarr/data:/config"
      - "{{ media_platform_movies_dir }}:/movies" #optional
      - "{{ media_platform_root_dir }}/downloads:/downloads" #optional
    ports:
      - 7878:7878
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - "{{ media_platform_root_dir }}/sonarr/data:/config"
      - "{{ media_platform_tvseries_dir }}:/tv #optional"
      - "{{ media_platform_root_dir }}/downloads:/downloads" #optional
    ports:
      - 8989:8989
    restart: unless-stopped
    
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - "{{ media_platform_root_dir }}/bazarr/config:/config"
      - "{{ media_platform_movies_dir }}:/movies" #optional
      - "{{ media_platform_tvseries_dir }}:/tv" #optional
    ports:
      - 6767:6767
    restart: unless-stopped
