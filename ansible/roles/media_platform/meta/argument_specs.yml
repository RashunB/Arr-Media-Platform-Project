---
argument_specs:
  main:
    short_description: Deploy the media platform stack via Docker Compose
    options:
      # Service principal
      media_platform_user:
        type: str
        required: false
        default: media
        description: System user owning media data and running the containers (PUID).
      media_platform_user_uid:
        type: int
        required: false
        default: 6000
        description: UID of the media service user.
      media_platform_group:
        type: str
        required: false
        default: media_platform
        description: System group owning media data (PGID).
      media_platform_group_gid:
        type: int
        required: false
        default: 6000
        description: GID of the media service group.

      # Web UI credentials
      media_platform_arr_webapp_username:
        type: str
        required: false
        description: Admin username applied to the *arr web UIs.
      media_platform_arr_webapp_password:
        type: str
        required: false
        description: Admin password applied to the *arr web UIs.

      # Usenet
      media_platform_usenet_provider:
        type: str
        required: false
        default: news.newshosting.com
        description: Usenet provider hostname used by SABnzbd.

      # Directories
      media_platform_compose_dir:
        type: str
        required: false
        default: /opt/docker/media_platform
        description: Directory holding the compose project and rendered env file.
      media_platform_root_dir:
        type: str
        required: false
        default: /opt/media_platform
        description: Base directory for all media data and config.
      media_platform_data_dir:
        type: str
        required: false
        default: "{{ media_platform_root_dir }}/data"
        description: Root of the single shared data tree enabling hardlinks and atomic moves.
      media_platform_config_dir:
        type: str
        required: false
        default: "{{ media_platform_root_dir }}/config"
        description: Parent directory for per-service /config volumes.
      media_platform_media_dir:
        type: str
        required: false
        default: "{{ media_platform_data_dir }}/media"
        description: Library root for organized media.
      media_platform_tvseries_dir:
        type: str
        required: false
        default: "{{ media_platform_media_dir }}/tv"
        description: TV series library path.
      media_platform_movies_dir:
        type: str
        required: false
        default: "{{ media_platform_media_dir }}/movies"
        description: Movie library path.
      media_platform_downloads_dir:
        type: str
        required: false
        default: "{{ media_platform_data_dir }}/downloads"
        description: Completed downloads path.
      media_platform_incomplete_downloads_dir:
        type: str
        required: false
        default: "{{ media_platform_data_dir }}/incomplete_downloads"
        description: In-progress downloads path.
      media_platform_dir_list:
        type: list
        elements: str
        required: false
        description: Directories created during provisioning.

      # Jellyfin
      media_platform_jellyfin_name:
        type: str
        required: false
        default: jellyfin
        description: Container/service name for Jellyfin.
      media_platform_jellyfin_hostname:
        type: str
        required: false
        default: "{{ media_platform_jellyfin_name }}"
        description: Hostname assigned to the Jellyfin container.
      media_platform_jellyfin_image:
        type: str
        required: false
        default: lscr.io/linuxserver/jellyfin:latest
        description: Container image reference for Jellyfin.
      media_platform_jellyfin_host_port:
        type: int
        required: false
        default: 8096
        description: Host port published for Jellyfin.

      # Seerr
      media_platform_seerr_name:
        type: str
        required: false
        default: seerr
        description: Container/service name for Seerr.
      media_platform_seerr_image:
        type: str
        required: false
        default: ghcr.io/seerr-team/seerr:latest
        description: Container image reference for Seerr.
      media_platform_seerr_host_port:
        type: int
        required: false
        default: 5055
        description: Host port published for Seerr.

      # Prowlarr
      media_platform_prowlarr_name:
        type: str
        required: false
        default: prowlarr
        description: Container/service name for Prowlarr.
      media_platform_prowlarr_image:
        type: str
        required: false
        default: lscr.io/linuxserver/prowlarr:latest
        description: Container image reference for Prowlarr.
      media_platform_prowlarr_host_port:
        type: int
        required: false
        default: 9696
        description: Host port published for Prowlarr.
      media_platform_prowlarr_api_key:
        type: str
        required: false
        description: API key applied to Prowlarr.

      # SABnzbd
      media_platform_sabnzbd_name:
        type: str
        required: false
        default: sabnzbd
        description: Container/service name for SABnzbd.
      media_platform_sabnzbd_image:
        type: str
        required: false
        default: lscr.io/linuxserver/sabnzbd:latest
        description: Container image reference for SABnzbd.
      media_platform_sabnzbd_host_port:
        type: int
        required: false
        default: 8080
        description: Host port published for SABnzbd.
      media_platform_sabnzbd_api_key:
        type: str
        required: false
        description: API key applied to SABnzbd.
      media_platform_sabnzbd_nzb_key:
        type: str
        required: false
        description: NZB key applied to SABnzbd.

      # Radarr
      media_platform_radarr_name:
        type: str
        required: false
        default: radarr
        description: Container/service name for Radarr.
      media_platform_radarr_image:
        type: str
        required: false
        default: lscr.io/linuxserver/radarr:latest
        description: Container image reference for Radarr.
      media_platform_radarr_host_port:
        type: int
        required: false
        default: 7878
        description: Host port published for Radarr.
      media_platform_radarr_api_key:
        type: str
        required: false
        description: API key applied to Radarr.

      # Sonarr
      media_platform_sonarr_name:
        type: str
        required: false
        default: sonarr
        description: Container/service name for Sonarr.
      media_platform_sonarr_image:
        type: str
        required: false
        default: lscr.io/linuxserver/sonarr:latest
        description: Container image reference for Sonarr.
      media_platform_sonarr_host_port:
        type: int
        required: false
        default: 8989
        description: Host port published for Sonarr.
      media_platform_sonarr_api_key:
        type: str
        required: false
        description: API key applied to Sonarr.

      # Bazarr
      media_platform_bazarr_name:
        type: str
        required: false
        default: bazarr
        description: Container/service name for Bazarr.
      media_platform_bazarr_image:
        type: str
        required: false
        default: lscr.io/linuxserver/bazarr:latest
        description: Container image reference for Bazarr.
      media_platform_bazarr_host_port:
        type: int
        required: false
        default: 6767
        description: Host port published for Bazarr.

      # Configarr
      media_platform_configarr_name:
        type: str
        required: false
        default: configarr
        description: Container/service name for Configarr.
      media_platform_configarr_image:
        type: str
        required: false
        default: docker.io/configarr/configarr:latest
        description: Container image reference for Configarr.

      media_platform_services_list:
        type: list
        elements: str
        required: false
        description: Services provisioned with a dedicated /config directory.
