---
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false   # let the hooks call terraform directly
      - uses: terraform-linters/setup-tflint@v4
      - name: Install trivy
        run: >-
          version=v0.74.0
          curl -sfL
          https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh
          | sudo sh -s -- -b /usr/local/bin "${version}"
      - name: Install terraform-docs
        run: |
          version=v0.24.0
          curl -sSLo /tmp/tfdocs.tar.gz \
            "https://github.com/terraform-docs/terraform-docs/releases/download/${version}/terraform-docs-${version}-linux-amd64.tar.gz"
          tar -xzf /tmp/tfdocs.tar.gz -C /tmp terraform-docs
          sudo install /tmp/terraform-docs /usr/local/bin/terraform-docs
      - uses: pre-commit/action@v3.0.1

  # Secret scanning across full history (not part of pre-commit).
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Lint the workflow files themselves (not part of pre-commit).
  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-check
