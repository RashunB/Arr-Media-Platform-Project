  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ansible/ansible-lint@665d9e07a1943254d2910faffc106adaf7ea7294
        # with:
        #   working_directory: ansible

  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: yamllint
        run: |
          pip install yamllint
          yamllint -f github .

  terraform-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_wrapper: false
      - name: Format check
        run: terraform fmt -check -recursive workspace
      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef
      - name: TFLint
        working-directory: workspace
        run: |
          tflint --init
          tflint --recursive --format compact

  terraform-validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack:
          - workspace/infrastructure/_base
          - workspace/deployments/media/infrastructure
          - workspace/deployments/media/application
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform-wrapper: false
      - name: Init (no backend)
        run: terraform -chdir=${{ matrix.stack }} init -backend=false

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: aquasecurity/trivy-actions@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: config
          scan-ref: workspace

  terraform-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c
        with:
          output-file: README.md
          output-method: inject
          fail-on-diff: "true"

  # Secret scanning across full history (not part of pre-commit).
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Lint the workflow files themselves (not part of pre-commit).
  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-check

  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install trivy
        run: >-
          version=v0.74.0
          curl -sfL
          https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh
          | sudo sh -s -- -b /usr/local/bin "${version}"
      - name: Hygiene and sops hooks
        run: |
          pip install pre-commit
          pre-commit run --all-files \
            trailing-white-space \
            end-of-file-checker \
            detect-private-key \
            check-added-large-files \
            terraform_trivy \
            sops
